stage: ingest
benchmark_version: "0.1.0"
random_seed: 42
enforce_gate: true
allow_fixture_sources: true
source_registry_path: configs/source_registry.yaml

# List of sources to ingest into data/processed/ingest/conversations.parquet
sources:
  - source_id: fixture
    input_path: tests/fixtures/sample_conversations.jsonl

  - source_id: conversations_gone_awry_wikipedia
    input_path: data/raw/conversations_gone_awry_wikipedia/conversations-gone-awry-corpus/utterances.jsonl

  - source_id: conversations_gone_awry_cmv
    input_path: data/raw/conversations_gone_awry_cmv/conversations-gone-awry-cmv-corpus/utterances.jsonl

  - source_id: lmsys_toxic_chat_train
    input_path: data/raw/lmsys_toxic_chat_train/toxic-chat_annotation_train.csv

  - source_id: lmsys_toxic_chat_test
    input_path: data/raw/lmsys_toxic_chat_test/toxic-chat_annotation_test.csv

  - source_id: davidson_hate_speech
    input_path: data/raw/davidson_hate_speech/davidson_labeled_data.csv

  - source_id: dynabench_hate_speech
    input_path: data/raw/dynabench_hate_speech/dynabench_hate_speech.csv

  - source_id: hatexplain
    input_path: data/raw/hatexplain/hatexplain.json

  - source_id: tweeteval_offensive
    input_path: data/raw/tweeteval_offensive/tweeteval_offensive_train.txt

  - source_id: tweeteval_hate
    input_path: data/raw/tweeteval_hate/tweeteval_hate_train.txt

