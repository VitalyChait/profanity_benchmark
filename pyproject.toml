[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youth-escalate-bench"
version = "0.1.0"
description = "YouthEscalateBench: Dynamic Multi-Turn Youth-Safeguarding Benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "YouthEscalateBench Team" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "click>=8.1",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
etl = [
    "duckdb>=1.0",
]

[project.scripts]
yeb = "youth_escalate_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/youth_escalate_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
