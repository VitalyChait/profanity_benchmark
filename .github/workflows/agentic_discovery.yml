name: Autonomous Slang & Profanity Discovery

on:
  schedule:
    # Run weekly every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  agentic-discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DISCOVERY_APP_ID }}
          private-key: ${{ secrets.DISCOVERY_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Autonomous Discovery Agent
        id: discover
        run: |
          yeb agent-discover --random-limit 15

      - name: Audit Sources and Lexicon
        run: |
          yeb audit-sources
          yeb lexicon-stats

      - name: Auto-commit digest when results match previous run
        if: steps.discover.outputs.same_as_previous == 'true'
        run: |
          git config user.name "discovery-bot-profanity-benchmark[bot]"
          git config user.email "discovery-bot-profanity-benchmark[bot]@users.noreply.github.com"
          git add reports/agentic_discovery_digest.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(agent): update discovery digest timestamp [skip ci]"
            git push origin HEAD:master
          fi

      - name: Commit and Create Discovery PR
        if: steps.discover.outputs.same_as_previous != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "feat(agent): autonomous weekly slang and profanity discovery update"
          title: "🤖 Weekly Autonomous Slang & Profanity Discovery"
          body: |
            Autonomous Agentic Discovery scan found new results.
            See `reports/agentic_discovery_digest.md` for newly scouted terms, category classifications, and synthesized minimal pairs (consecutive runs with identical results are consolidated under the latest run timestamp).
          branch: agentic-discovery-update
          base: master
